name: CI/CD Deploy to EKS

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag and Push Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        VERSION_TAG="v1.0.0"
        REPO_NAME="apuestas-service" 
        
        export DOCKER_BUILDKIT=1
        
        docker build -t $ECR_REGISTRY/$REPO_NAME:${{ github.sha }} \
                     -t $ECR_REGISTRY/$REPO_NAME:latest \
                     -t $ECR_REGISTRY/$REPO_NAME:$VERSION_TAG .
        
        docker push $ECR_REGISTRY/$REPO_NAME:${{ github.sha }}
        docker push $ECR_REGISTRY/$REPO_NAME:latest
        docker push $ECR_REGISTRY/$REPO_NAME:$VERSION_TAG

    - name: Update Kubeconfig for EKS
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name vidalcasino-cluster

    - name: Deploy Manifests to EKS Cluster
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        sed -i "s/\${AWS_ACCOUNT_ID}/$ECR_REGISTRY/g" deployment.yaml
        
        kubectl apply -f deployment.yaml
        
        kubectl rollout restart deployment/apuestas-service